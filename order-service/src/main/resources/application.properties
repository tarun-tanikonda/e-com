spring.application.name=order-service
server.port=8084

# PostgreSQL 16 Configuration (order_schema on Neon Cloud DB)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-flat-glade-b3run608-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/e-com?currentSchema=order_schema&sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_a1gMIoES8irw}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & Pool Optimization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=order_schema
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
